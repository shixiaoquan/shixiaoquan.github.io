name: Update Wencai Data

# 问财拉取较慢，单独每小时运行；行情与模拟盘仍每 5 分钟更新
# Cookie 配置见 .github/WENCAI_SETUP.md（仓库 Secret: WENCAI_COOKIE）

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-push-master
  cancel-in-progress: false

jobs:
  wencai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: ./.github/actions/setup-python-deps

      - name: Fetch wencai data
        env:
          WENCAI_COOKIE: ${{ secrets.WENCAI_COOKIE }}
        run: python scripts/fetch_wencai.py

      - name: Verify wencai output
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("data/wencai.json", encoding="utf-8"))
          print("cookieUsed:", d.get("cookieUsed"))
          print("status:", d.get("status"))
          print("message:", d.get("message"))
          for s in d.get("screens", []):
              print(f"  {s.get('id')}: {s.get('status')}")
          if not d.get("cookieUsed"):
              print("WARN: WENCAI_COOKIE 未生效，请检查仓库 Secret 名称与值")
          PY

      - name: Build site evolution status
        env:
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/build_site_status.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wencai.json data/site_status.json
          if git diff --staged --quiet; then
            echo "No wencai changes."
          else
            git commit -m "chore: update wencai data"
            git pull --rebase origin master
            git push
          fi
