name: Update Wencai Data

# 问财拉取较慢，单独每小时运行；行情与模拟盘仍每 5 分钟更新
# Cookie 配置见 .github/WENCAI_SETUP.md（仓库 Secret: WENCAI_COOKIE）

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wencai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch wencai data
        env:
          WENCAI_COOKIE: ${{ secrets.WENCAI_COOKIE }}
        run: python scripts/fetch_wencai.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wencai.json
          if git diff --staged --quiet; then
            echo "No wencai changes."
          else
            git commit -m "chore: update wencai data"
            git push
          fi
