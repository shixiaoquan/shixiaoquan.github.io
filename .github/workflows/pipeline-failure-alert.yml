name: Pipeline Failure Alert

# 数据流水线失败时开 Issue；成功时自动关闭同名失败 Issue

on:
  workflow_run:
    workflows:
      - Update Market Data
      - Update Wencai Data
      - Update Truth Social
      - Generate Investment Report
      - Weekly Backtest
      - Continuous Evolution
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `[自动] 工作流失败 · ${run.name}`;
            const body = [
              'GitHub Actions 工作流执行失败，请检查日志。',
              '',
              `- 工作流：**${run.name}**`,
              `- 分支：${run.head_branch}`,
              `- 运行：[#${run.id}](${run.html_url})`,
              `- 结论：${run.conclusion}`,
              '',
              '后续成功运行将自动关闭本 Issue。',
              '',
              '<!-- workflow-failure-bot -->',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-health',
              per_page: 30,
            });
            const dup = issues.find(i => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `再次失败 · ${new Date().toISOString()}\n${run.html_url}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['pipeline-health', 'automated'],
            });

  resolve:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `[自动] 工作流失败 · ${run.name}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-health',
              per_page: 30,
            });
            const existing = issues.find(i => i.title === title);
            if (!existing) {
              core.info(`No open failure issue for ${run.name}`);
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `已恢复成功 · ${new Date().toISOString()}\n${run.html_url}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
            });
            core.info(`Closed issue #${existing.number}`);
