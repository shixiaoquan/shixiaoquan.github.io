name: Continuous Evolution

# 汇总各模块新鲜度与策略进化指标；代码或工作流变更时同步更新看板数据

on:
  schedule:
    - cron: "30 * * * *"
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - "js/**"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build site status
        env:
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/build_site_status.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site_status.json
          if git diff --staged --quiet; then
            echo "Site status unchanged."
          else
            git commit -m "chore: update site evolution status"
            git pull --rebase origin master
            git push
          fi
