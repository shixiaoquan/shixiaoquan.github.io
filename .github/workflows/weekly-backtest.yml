name: Weekly Backtest

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-push-master
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python-deps

      - name: Run backtest
        run: python scripts/backtest.py

      - name: Run paper backtest (Xiaomi)
        run: python scripts/paper_backtest.py

      - name: Reco T+N attribution
        run: python scripts/reco_attribution.py

      - name: Shadow T+N attribution
        run: python scripts/shadow_attribution.py || true

      - name: Paired shadow vs prod attribution
        run: python scripts/paired_attribution.py || true

      - name: Strategy param sweep
        run: python scripts/strategy_param_sweep.py

      - name: Tactic tune from attribution
        run: python scripts/tactic_tune.py

      - name: Paper A/B compare
        run: python scripts/paper_ab.py

      - name: Archive reco history
        run: python scripts/archive_reco_history.py

      - name: Shadow track & evolution queue
        run: |
          python scripts/shadow_reco.py || true
          python scripts/build_evolution_queue.py

      - name: Build site evolution status
        env:
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/build_site_status.py

      - name: Validate data schema
        run: python scripts/validate_data.py

      - name: Commit and push if changed
        run: >
          bash scripts/git_push_data.sh "chore: weekly backtest and evolution update"
          data/backtest.json data/paper_backtest.json data/paper_backtest_curves/
          data/reco_attribution.json data/shadow_attribution.json data/paired_attribution.json
          data/strategy_candidates.json data/evolution_log.json data/tactic_tune.json data/paper_ab.json
          data/reco_history.json data/reco_history_recent.json data/shadow_reco.json
          data/evolution_queue.json data/archive/ data/site_status.json
