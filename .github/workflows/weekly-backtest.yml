name: Weekly Backtest

# 策略回测每周运行一次；行情与信号仍由 update-market-data 每 5 分钟更新

on:
  schedule:
    # 每周日 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run backtest
        run: python scripts/backtest.py

      - name: Run paper backtest (Xiaomi)
        run: python scripts/paper_backtest.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest.json data/paper_backtest.json
          if git diff --staged --quiet; then
            echo "No backtest changes."
          else
            git commit -m "chore: weekly backtest update"
            git push
          fi
