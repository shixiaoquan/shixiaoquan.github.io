name: Generate Investment Report

# 北京时间 09:00 / 12:00 / 16:00 生成投资决策日报
# UTC: 01:00 / 04:00 / 08:00

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 4 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "报告时段"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - morning
          - noon
          - afternoon
      refresh_data:
        description: "生成前刷新行情（默认否，读仓库已有 JSON）"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: data-push-master
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python-deps

      - name: Refresh market data (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_data == 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python scripts/fetch_data.py
          python scripts/fetch_macro.py
          python scripts/trading_engine.py

      - name: Generate investment report
        id: generate
        run: python scripts/generate_report.py --slot "${{ github.event.inputs.slot || 'auto' }}" 2> report_error.log

      - name: Report failure diagnostics
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let err = '';
            try { err = fs.readFileSync('report_error.log', 'utf8').slice(0, 2000); } catch {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[自动] 研报生成失败',
              body: [
                'generate-investment-report 工作流失败。',
                '',
                '```',
                err || '(无 stderr)',
                '```',
                '',
                '<!-- report-gen-bot -->',
              ].join('\n'),
              labels: ['pipeline-health', 'automated'],
            });

      - name: Build site evolution status
        if: success()
        env:
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/build_site_status.py

      - name: Commit and push if changed
        if: success()
        run: |
          bash scripts/git_push_data.sh "chore: update investment report" data/reports/ data/site_status.json
