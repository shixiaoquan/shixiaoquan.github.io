name: Update Market Data

# 纯静态站数据构建：交易日高频 / 休市降频（见 market_calendar.py）

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-push-master
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python-deps

      - name: Market calendar
        id: cal
        run: python scripts/market_calendar.py

      - name: Fetch market data
        if: steps.cal.outputs.intensity != 'closed' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python scripts/fetch_data.py
          python scripts/fetch_macro.py

      - name: Light refresh (market closed)
        if: steps.cal.outputs.intensity == 'closed' && github.event_name != 'workflow_dispatch'
        run: |
          python scripts/tactic_tune.py || true
          python scripts/build_evolution_queue.py
          python scripts/build_site_status.py

      - name: Tactic tune from attribution
        if: steps.cal.outputs.intensity != 'closed' || github.event_name == 'workflow_dispatch'
        run: python scripts/tactic_tune.py

      - name: Run trading engine
        if: steps.cal.outputs.intensity != 'closed' || github.event_name == 'workflow_dispatch'
        run: python scripts/trading_engine.py

      - name: Build site evolution status
        if: steps.cal.outputs.intensity != 'closed' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/build_evolution_queue.py
          python scripts/build_site_status.py

      - name: Validate data schema
        run: python scripts/validate_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update market data"
            git pull --rebase origin master
            git push
          fi
